security:
  - SessionCookie: []
components:
  schemas:
    ActivityLevel:
      type: string
      enum:
        - low
        - moderate
        - high
    AddMealEntry:
      type: object
      required:
        - date
        - slot
        - foodId
        - quantity
      properties:
        date:
          type: string
          format: date
        slot:
          $ref: '#/components/schemas/MealSlot'
        foodId:
          type: string
        quantity:
          $ref: '#/components/schemas/Quantity'
        clientRef:
          type: string
          maxLength: 64
          description: 再送時の重複防止キー
    AuthConfig:
      type: object
      required:
        - setupRequired
        - registrationOpen
        - localEnabled
        - oidcEnabled
      properties:
        setupRequired:
          type: boolean
          description: 利用者0件で初回セットアップが必要
        registrationOpen:
          type: boolean
        localEnabled:
          type: boolean
        oidcEnabled:
          type: boolean
        oidcName:
          type: string
          description: ログイン画面に表示するOIDCプロバイダ名
    Basis:
      type: object
      required:
        - unit
      properties:
        unit:
          type: string
          minLength: 1
          maxLength: 30
          description: 1個, 1食等
        grams:
          type: number
          format: double
          description: 1単位の重量(g), 省略は不明
          minimum: 0
          exclusiveMinimum: true
      description: 栄養値の基準量, 省略は可食部100g
    CopyMeals:
      type: object
      required:
        - fromDate
        - toDate
      properties:
        fromDate:
          type: string
          format: date
        fromSlot:
          allOf:
            - $ref: '#/components/schemas/MealSlot'
          description: 省略時は全区分
        toDate:
          type: string
          format: date
        toSlot:
          allOf:
            - $ref: '#/components/schemas/MealSlot'
          description: 省略時は元と同じ区分
    CreateUserRequest:
      type: object
      required:
        - loginName
        - password
        - role
      properties:
        loginName:
          type: string
          pattern: ^[a-zA-Z0-9_.-]{3,32}$
        password:
          type: string
          minLength: 8
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    Credentials:
      type: object
      required:
        - loginName
        - password
      properties:
        loginName:
          type: string
          pattern: ^[a-zA-Z0-9_.-]{3,32}$
        password:
          type: string
          minLength: 8
    DailyReport:
      type: object
      required:
        - summary
        - evaluations
      properties:
        summary:
          $ref: '#/components/schemas/DaySummary'
        targets:
          allOf:
            - $ref: '#/components/schemas/Targets'
          description: 身体情報・体重が未登録なら省略
        evaluations:
          type: array
          items:
            $ref: '#/components/schemas/Evaluation'
    Dataset:
      type: object
      required:
        - id
        - kind
        - name
        - version
        - license
        - url
        - attribution
        - importedAt
      properties:
        id:
          type: string
        kind:
          type: string
        name:
          type: string
        version:
          type: string
        license:
          type: string
        url:
          type: string
        attribution:
          type: string
        importedAt:
          type: string
          format: date-time
    DaySummary:
      type: object
      required:
        - date
        - entryCount
        - total
        - bySlot
      properties:
        date:
          type: string
          format: date
        entryCount:
          type: integer
          format: int32
        total:
          $ref: '#/components/schemas/NutrientProfile'
        bySlot:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/NutrientProfile'
    DayView:
      type: object
      required:
        - date
        - entries
        - report
      properties:
        date:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: '#/components/schemas/MealEntry'
        report:
          $ref: '#/components/schemas/DailyReport'
        latestWeight:
          allOf:
            - $ref: '#/components/schemas/Weight'
          description: 当日以前で最新の体重
      description: ホーム画面用の1日分
    Evaluation:
      type: object
      required:
        - code
        - level
        - value
      properties:
        code:
          type: string
        level:
          $ref: '#/components/schemas/Level'
        value:
          $ref: '#/components/schemas/NutrientValue'
        lower:
          type: number
          format: double
        upper:
          type: number
          format: double
    ExportBundle:
      type: object
      required:
        - format
        - version
        - exportedAt
        - user
        - settings
        - weights
        - foods
        - favorites
        - meals
      properties:
        format:
          type: string
          enum:
            - mecalo-export
        version:
          type: number
          enum:
            - 1
        exportedAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
        settings:
          type: array
          items:
            $ref: '#/components/schemas/Settings'
        weights:
          type: array
          items:
            $ref: '#/components/schemas/Weight'
        foods:
          type: array
          items:
            $ref: '#/components/schemas/ExportFood'
        favorites:
          type: array
          items:
            type: string
        meals:
          type: array
          items:
            $ref: '#/components/schemas/MealEntry'
      description: 1利用者分の全データ
    ExportFood:
      type: object
      required:
        - id
        - kind
        - barcode
        - createdAt
        - revisions
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/FoodKind'
        barcode:
          type: string
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/FoodRevision'
          description: 番号順の全リビジョン
        recipes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RecipeComposition'
          description: recipe種別のみ, キーはリビジョンID
    ExternalFood:
      type: object
      required:
        - datasetId
        - datasetName
        - reference
        - name
        - brand
        - nutrients
        - portions
      properties:
        datasetId:
          type: string
        datasetName:
          type: string
          description: 取得元の表示名
        reference:
          type: string
        name:
          type: string
        brand:
          type: string
        nutrients:
          $ref: '#/components/schemas/NutrientProfile'
        basis:
          $ref: '#/components/schemas/Basis'
        portions:
          type: array
          items:
            $ref: '#/components/schemas/Portion'
        savedId:
          type: string
          description: 保存済みの場合の食品ID
      description: 外部取得元の検索結果1件, 未保存
    ExternalFoodSelection:
      type: object
      required:
        - datasetId
        - reference
      properties:
        datasetId:
          type: string
        reference:
          type: string
    ExternalSearchResult:
      type: object
      required:
        - foods
        - failed
        - attributions
      properties:
        foods:
          type: array
          items:
            $ref: '#/components/schemas/ExternalFood'
        failed:
          type: array
          items:
            type: string
          description: 取得できなかった取得元
        attributions:
          type: array
          items:
            type: string
          description: 結果に含まれる取得元の帰属表示
    Food:
      type: object
      required:
        - id
        - kind
        - barcode
        - editable
        - favorite
        - deleted
        - discontinued
        - revision
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/FoodKind'
        barcode:
          type: string
        editable:
          type: boolean
          description: 所有し編集可能
        favorite:
          type: boolean
        deleted:
          type: boolean
        discontinued:
          type: boolean
          description: 取得元の一覧から消えた食品, 検索対象外
        revision:
          $ref: '#/components/schemas/FoodRevision'
    FoodInput:
      type: object
      required:
        - name
        - nutrients
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        brand:
          type: string
        aliases:
          type: array
          items:
            type: string
          maxItems: 20
          description: 検索対象の別名
        barcode:
          type: string
        nutrients:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/NutrientInput'
        basis:
          $ref: '#/components/schemas/Basis'
        portions:
          type: array
          items:
            $ref: '#/components/schemas/Portion'
    FoodKind:
      type: string
      enum:
        - standard
        - product
        - custom
        - recipe
    FoodRevision:
      type: object
      required:
        - id
        - number
        - name
        - brand
        - aliases
        - nutrients
        - portions
        - source
        - createdAt
      properties:
        id:
          type: string
        number:
          type: integer
          format: int32
        name:
          type: string
        brand:
          type: string
        aliases:
          type: array
          items:
            type: string
          description: 検索対象の別名
        nutrients:
          allOf:
            - $ref: '#/components/schemas/NutrientProfile'
          description: 可食部100gあたり, basis指定時はその1単位あたり
        basis:
          $ref: '#/components/schemas/Basis'
        portions:
          type: array
          items:
            $ref: '#/components/schemas/Portion'
        source:
          $ref: '#/components/schemas/FoodSource'
        createdAt:
          type: string
          format: date-time
    FoodSelection:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 100
          description: 食品を選ぶ前に入力した検索語
    FoodSource:
      type: object
      required:
        - datasetId
        - reference
        - url
      properties:
        datasetId:
          type: string
        reference:
          type: string
          description: 食品番号, バーコード等
        url:
          type: string
          description: 取得元ページ, 空は取込元全体
        retrievedAt:
          type: string
          format: date-time
          description: 取得日時
    Goal:
      type: string
      enum:
        - lose
        - maintain
        - gain
    ImportResult:
      type: object
      required:
        - foods
        - meals
        - weights
        - settings
        - skipped
      properties:
        foods:
          type: integer
          format: int32
        meals:
          type: integer
          format: int32
        weights:
          type: integer
          format: int32
        settings:
          type: integer
          format: int32
        skipped:
          type: integer
          format: int32
    Indicators:
      type: object
      properties:
        ear:
          type: number
          format: double
        rda:
          type: number
          format: double
        ai:
          type: number
          format: double
        ul:
          type: number
          format: double
        dgMin:
          type: number
          format: double
        dgMax:
          type: number
          format: double
    IngredientInput:
      type: object
      required:
        - foodId
        - quantity
      properties:
        foodId:
          type: string
        quantity:
          $ref: '#/components/schemas/Quantity'
    Level:
      type: string
      enum:
        - deficient
        - low
        - adequate
        - high
        - excessive
        - unknown
        - none
    MealEntry:
      type: object
      required:
        - id
        - date
        - slot
        - foodId
        - foodRevisionId
        - foodName
        - brand
        - source
        - quantity
        - grams
        - nutrients
        - clientRef
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        slot:
          $ref: '#/components/schemas/MealSlot'
        foodId:
          type: string
        foodRevisionId:
          type: string
        foodName:
          type: string
        brand:
          type: string
        source:
          $ref: '#/components/schemas/FoodSource'
        quantity:
          $ref: '#/components/schemas/Quantity'
        grams:
          type: number
          format: double
        nutrients:
          allOf:
            - $ref: '#/components/schemas/NutrientProfile'
          description: grams分の栄養値
        clientRef:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: 記録時点の食品情報と栄養値を保持
    MealSlot:
      type: string
      enum:
        - breakfast
        - lunch
        - dinner
        - snack
    NutrientDefinition:
      type: object
      required:
        - code
        - unit
        - group
      properties:
        code:
          type: string
        unit:
          $ref: '#/components/schemas/NutrientUnit'
        group:
          $ref: '#/components/schemas/NutrientGroup'
    NutrientGroup:
      type: string
      enum:
        - energy
        - macro
        - mineral
        - vitamin
    NutrientInput:
      type: object
      properties:
        amount:
          type: number
          format: double
        status:
          type: string
          enum:
            - measured
            - estimated
            - trace
            - missing
      description: 入力用の栄養値, amount省略は未計測
    NutrientProfile:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/NutrientValue'
      description: キーは栄養素コード, キーなしは未計測
    NutrientStatus:
      type: string
      enum:
        - measured
        - estimated
        - trace
        - missing
        - calculated
      description: 栄養値の状態
    NutrientTarget:
      type: object
      required:
        - code
      properties:
        code:
          type: string
        ear:
          type: number
          format: double
        rda:
          type: number
          format: double
        ai:
          type: number
          format: double
        ul:
          type: number
          format: double
        dgMin:
          type: number
          format: double
        dgMax:
          type: number
          format: double
        goal:
          type: number
          format: double
          description: エネルギーの目標値
        customMin:
          type: number
          format: double
        customMax:
          type: number
          format: double
    NutrientUnit:
      type: string
      enum:
        - kcal
        - g
        - mg
        - ug
    NutrientValue:
      type: object
      required:
        - amount
        - status
        - coverage
      properties:
        amount:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/NutrientStatus'
        coverage:
          type: number
          format: double
          description: 元の重量のうち値が判明している割合(0〜1)
    PasswordChange:
      type: object
      required:
        - current
        - next
      properties:
        current:
          type: string
        next:
          type: string
          minLength: 8
    Portion:
      type: object
      required:
        - unit
        - grams
      properties:
        unit:
          type: string
        grams:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
    Problem:
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
      description: RFC 9457 Problem Details
    Profile:
      type: object
      required:
        - sex
        - birthDate
        - heightCm
        - activity
        - goal
        - energyAdjustKcal
        - menstruating
      properties:
        sex:
          $ref: '#/components/schemas/Sex'
        birthDate:
          type: string
          format: date
        heightCm:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        activity:
          $ref: '#/components/schemas/ActivityLevel'
        goal:
          $ref: '#/components/schemas/Goal'
        energyAdjustKcal:
          type: number
          format: double
          description: 目的に応じたエネルギー増減(kcal/日)
        menstruating:
          type: boolean
          description: 鉄の基準値選択用
    Quantity:
      type: object
      required:
        - amount
        - unit
      properties:
        amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        unit:
          type: string
          description: '"g" または食品の単位名'
    QuickPick:
      type: object
      required:
        - food
        - quantity
      properties:
        food:
          $ref: '#/components/schemas/Food'
        quantity:
          $ref: '#/components/schemas/Quantity'
    QuickPicks:
      type: object
      required:
        - recent
        - frequent
        - favorites
        - searches
      properties:
        recent:
          type: array
          items:
            $ref: '#/components/schemas/QuickPick'
        frequent:
          type: array
          items:
            $ref: '#/components/schemas/QuickPick'
        favorites:
          type: array
          items:
            $ref: '#/components/schemas/QuickPick'
        searches:
          type: array
          items:
            type: string
    RangeReport:
      type: object
      required:
        - from
        - to
        - days
        - recordedDays
        - average
        - averageEvaluations
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: array
          items:
            $ref: '#/components/schemas/DailyReport'
        recordedDays:
          type: integer
          format: int32
        average:
          $ref: '#/components/schemas/NutrientProfile'
        averageEvaluations:
          type: array
          items:
            $ref: '#/components/schemas/Evaluation'
    Recipe:
      type: object
      required:
        - food
        - lines
        - rawGrams
        - cookedGrams
        - servings
      properties:
        food:
          $ref: '#/components/schemas/Food'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/RecipeLine'
        rawGrams:
          type: number
          format: double
        cookedGrams:
          type: number
          format: double
        servings:
          type: number
          format: double
    RecipeComposition:
      type: object
      required:
        - lines
        - rawGrams
        - cookedGrams
        - servings
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/RecipeLine'
        rawGrams:
          type: number
          format: double
        cookedGrams:
          type: number
          format: double
        servings:
          type: number
          format: double
      description: レシピの材料構成
    RecipeInput:
      type: object
      required:
        - name
        - ingredients
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/IngredientInput'
          minItems: 1
        cookedGrams:
          type: number
          format: double
          description: 完成重量(g), 省略時は材料重量の合計
        servings:
          type: number
          format: double
          description: 何人前, 省略時は人前単位なし
    RecipeLine:
      type: object
      required:
        - foodId
        - revisionId
        - name
        - quantity
        - grams
      properties:
        foodId:
          type: string
        revisionId:
          type: string
        name:
          type: string
        quantity:
          $ref: '#/components/schemas/Quantity'
        grams:
          type: number
          format: double
    ReferenceInfo:
      type: object
      required:
        - edition
        - title
        - url
      properties:
        edition:
          type: string
        title:
          type: string
        url:
          type: string
    Role:
      type: string
      enum:
        - admin
        - member
    Settings:
      type: object
      required:
        - effectiveFrom
        - profile
        - overrides
      properties:
        effectiveFrom:
          type: string
          format: date
        profile:
          $ref: '#/components/schemas/Profile'
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/TargetOverride'
    SettingsInput:
      type: object
      required:
        - profile
      properties:
        effectiveFrom:
          type: string
          format: date
          description: 省略時は当日
        profile:
          $ref: '#/components/schemas/Profile'
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/TargetOverride'
    SetupRequest:
      type: object
      required:
        - loginName
        - password
        - setupToken
      properties:
        loginName:
          type: string
          pattern: ^[a-zA-Z0-9_.-]{3,32}$
        password:
          type: string
          minLength: 8
        displayName:
          type: string
        setupToken:
          type: string
          description: MECALO_SETUP_TOKENの値, 未指定時は起動時のログに出力
    Sex:
      type: string
      enum:
        - male
        - female
    SignUpRequest:
      type: object
      required:
        - loginName
        - password
      properties:
        loginName:
          type: string
          pattern: ^[a-zA-Z0-9_.-]{3,32}$
        password:
          type: string
          minLength: 8
        displayName:
          type: string
    Source:
      type: object
      required:
        - dataset
        - kind
        - error
        - items
        - running
      properties:
        dataset:
          $ref: '#/components/schemas/Dataset'
        kind:
          $ref: '#/components/schemas/SourceKind'
        syncedAt:
          type: string
          format: date-time
        error:
          type: string
          description: 直近の同期の失敗内容, 空は成功
        items:
          type: integer
          format: int32
          description: 直近の同期で確認した商品数
        running:
          type: boolean
          description: 同期中
    SourceKind:
      type: string
      enum:
        - lookup
        - finder
        - catalog
    TargetOverride:
      type: object
      required:
        - code
      properties:
        code:
          type: string
        min:
          type: number
          format: double
        max:
          type: number
          format: double
    Targets:
      type: object
      required:
        - edition
        - ageBand
        - energyKcal
        - nutrients
      properties:
        edition:
          type: string
        ageBand:
          type: string
        energyKcal:
          type: number
          format: double
        nutrients:
          type: array
          items:
            $ref: '#/components/schemas/NutrientTarget'
    UpdateMealEntry:
      type: object
      properties:
        date:
          type: string
          format: date
        slot:
          $ref: '#/components/schemas/MealSlot'
        quantity:
          $ref: '#/components/schemas/Quantity'
    User:
      type: object
      required:
        - id
        - displayName
        - role
        - createdAt
      properties:
        id:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
    Weight:
      type: object
      required:
        - date
        - kg
      properties:
        date:
          type: string
          format: date
        kg:
          type: number
          format: double
        bodyFatPct:
          type: number
          format: double
    WeightInput:
      type: object
      required:
        - kg
      properties:
        kg:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        bodyFatPct:
          type: number
          format: double
          minimum: 0
          maximum: 100
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: mecalo_session
      description: ログイン時に発行するセッションCookie
servers:
  - url: /api
    description: Same origin
    variables: {}
